openapi: 3.1.0
info:
  title: Flow Coach Actions prototype
  version: 0.2.0
  description: >-
    Read a short-lived Flow coach snapshot and store draft routine patches.
    Creating a pending patch never changes a routine. Flow previews and applies
    every change locally after explicit user confirmation.
servers:
  - url: https://REPLACE_WITH_HTTPS_HOST/actions
security:
  - FlowCoachKey: []
paths:
  /coach-context:
    get:
      operationId: get_flow_coach_context
      summary: Read the current Flow coach snapshot
      description: >-
        Returns the current contextId, routine summaries, recent training counts
        and short digests. Use the returned contextId for every follow-up call.
      responses:
        "200":
          description: Current coach snapshot summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachContextSummary"
  /routines:
    get:
      operationId: list_flow_routines
      summary: List routines in one coach snapshot
      parameters:
        - $ref: "#/components/parameters/ContextId"
      responses:
        "200":
          description: Routine summaries
          content:
            application/json:
              schema:
                type: object
                required: [contextId, routines]
                properties:
                  contextId:
                    type: string
                    format: uuid
                  routines:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoutineSummary"
        "409":
          $ref: "#/components/responses/StaleContext"
  /routines/{routineId}:
    get:
      operationId: get_flow_routine
      summary: Read one complete Flow routine
      description: >-
        Read this before proposing a patch so section and exercise IDs, current
        values and revision identity are copied from the snapshot rather than guessed.
      parameters:
        - $ref: "#/components/parameters/ContextId"
        - name: routineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Complete routine body
          content:
            application/json:
              schema:
                type: object
                required: [contextId, routine]
                properties:
                  contextId:
                    type: string
                    format: uuid
                  routine:
                    $ref: "#/components/schemas/Routine"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/StaleContext"
  /training-summary:
    get:
      operationId: get_flow_training_summary
      summary: Read bounded recent training summaries
      description: >-
        Returns recent strength and cardio summaries from the chosen snapshot.
        HealthKit-derived metrics are excluded unless includeHealthMetrics is true.
      parameters:
        - $ref: "#/components/parameters/ContextId"
        - name: strengthLimit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
        - name: cardioLimit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 5
        - name: includeHealthMetrics
          in: query
          description: Leave false unless the user explicitly included HealthKit-derived metrics in the snapshot.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Recent training summaries
          content:
            application/json:
              schema:
                type: object
                required: [contextId, generatedAt, includesHealthMetrics, strength, cardio]
                properties:
                  contextId:
                    type: string
                    format: uuid
                  generatedAt:
                    type: string
                    format: date-time
                  includesHealthMetrics:
                    type: boolean
                  strength:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  cardio:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "409":
          $ref: "#/components/responses/StaleContext"
  /patches/validate:
    post:
      operationId: validate_flow_routine_patch
      summary: Validate a proposed patch without storing it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEnvelope"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "409":
          $ref: "#/components/responses/StaleContext"
  /pending-patches:
    post:
      operationId: create_pending_flow_routine_patch
      summary: Store a draft routine patch for Flow to review
      description: >-
        This action only stores a draft. It does not modify any routine. Flow
        will pull the draft, validate it against live state, show a diff and ask
        the user before anything is saved. Repeating the same request returns
        the existing draft rather than creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEnvelope"
      responses:
        "201":
          description: New pending draft stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePatchResult"
        "200":
          description: Identical existing draft returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePatchResult"
        "409":
          $ref: "#/components/responses/StaleContext"
        "422":
          description: Patch rejected before storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
components:
  securitySchemes:
    FlowCoachKey:
      type: apiKey
      in: header
      name: X-Flow-Coach-Key
  parameters:
    ContextId:
      name: contextId
      in: query
      required: true
      description: Opaque snapshot ID returned by get_flow_coach_context.
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaleContext:
      description: The supplied contextId is no longer current in this prototype
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        currentContextId:
          type: string
          format: uuid
    CoachContextSummary:
      type: object
      required:
        - contextId
        - generatedAt
        - app
        - routines
        - recentStrengthSummaryCount
        - recentCardioSummaryCount
        - recentStrengthDigest
        - recentCardioDigest
      properties:
        contextId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        app:
          type: string
        routines:
          type: array
          items:
            $ref: "#/components/schemas/RoutineSummary"
        recentStrengthSummaryCount:
          type: integer
        recentCardioSummaryCount:
          type: integer
        recentStrengthDigest:
          type: array
          items:
            type: string
        recentCardioDigest:
          type: array
          items:
            type: string
        constraintsNotes:
          type: string
    RoutineSummary:
      type: object
      required: [id, name, currentPhase, sectionCount, exerciseCount, contentHash, stateHash]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currentPhase:
          $ref: "#/components/schemas/WorkoutPhase"
        sectionCount:
          type: integer
        exerciseCount:
          type: integer
        contentHash:
          type: string
          pattern: "^c1-[0-9a-f]{16}$"
        stateHash:
          type: string
          pattern: "^s1-[0-9a-f]{16}$"
    Routine:
      type: object
      required: [id, name, sections, currentPhase]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currentPhase:
          $ref: "#/components/schemas/WorkoutPhase"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
    Section:
      type: object
      required: [id, name, exercises]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
    Exercise:
      type: object
      required:
        - id
        - name
        - sets
        - reps
        - restBetweenSetsSeconds
        - restAfterExerciseSeconds
        - notes
        - perSide
        - phaseOverrides
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sets:
          type: integer
          minimum: 1
          maximum: 10
        reps:
          type: integer
          minimum: 1
          maximum: 100
        durationSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        restBetweenSetsSeconds:
          type: integer
          minimum: 0
          maximum: 900
        restAfterExerciseSeconds:
          type: integer
          minimum: 0
          maximum: 900
        notes:
          type: string
          maxLength: 500
        perSide:
          type: boolean
        phaseOverrides:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PhaseOverride"
    WorkoutPhase:
      type: string
      enum: [base, peak, deload]
    PhaseOverride:
      type: object
      properties:
        sets:
          type: integer
          minimum: 1
          maximum: 10
        reps:
          type: integer
          minimum: 1
          maximum: 100
        durationSeconds:
          type: integer
          minimum: 1
          maximum: 3600
    PatchEnvelope:
      type: object
      additionalProperties: false
      required: [contextId, patch]
      properties:
        contextId:
          type: string
          format: uuid
        patch:
          $ref: "#/components/schemas/FlowRoutinePatch"
    FlowRoutinePatch:
      type: object
      additionalProperties: false
      required: [schemaVersion, routineId, baseContentHash, rationale, operations]
      properties:
        schemaVersion:
          type: integer
          const: 2
        routineId:
          type: string
          format: uuid
        baseContentHash:
          type: string
          pattern: "^c1-[0-9a-f]{16}$"
        exportedAt:
          type: string
          format: date-time
        rationale:
          type: string
          minLength: 1
        operations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PatchOperation"
    PatchOperation:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            - replaceExerciseReps
            - replaceExerciseSets
            - replaceTimedDuration
            - replaceRestBetweenSets
            - replaceRestAfterExercise
            - updateExerciseNotes
            - addExercise
            - removeExercise
            - moveExercise
            - replacePhaseOverride
        exerciseId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        targetSectionId:
          type: string
          format: uuid
        afterExerciseId:
          type: string
          format: uuid
        phase:
          $ref: "#/components/schemas/WorkoutPhase"
        expectedIntValue:
          type: integer
        newIntValue:
          type: integer
        expectedStringValue:
          type: string
        newStringValue:
          type: string
        expectedPhaseOverride:
          $ref: "#/components/schemas/PhaseOverride"
        newPhaseOverride:
          $ref: "#/components/schemas/PhaseOverride"
        removePhaseOverride:
          type: boolean
        exercise:
          $ref: "#/components/schemas/Exercise"
    ValidationResult:
      type: object
      required: [valid, problems]
      properties:
        valid:
          type: boolean
        problems:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
    CreatePatchResult:
      type: object
      required: [stored, duplicate, patch, message]
      properties:
        stored:
          type: boolean
        duplicate:
          type: boolean
        message:
          type: string
        patch:
          type: object
          required:
            - patchId
            - contextId
            - routineId
            - baseContentHash
            - createdAt
            - expiresAt
            - status
            - assistantProvider
            - rationale
          properties:
            patchId:
              type: string
              format: uuid
            contextId:
              type: string
              format: uuid
            routineId:
              type: string
              format: uuid
            baseContentHash:
              type: string
            createdAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
            status:
              type: string
              enum: [pending]
            assistantProvider:
              type: string
            rationale:
              type: string
